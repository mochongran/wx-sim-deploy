          </g>
        </svg>
      </div>
      <div class="qrcode-tip">扫一扫上面的二维码图案，加我微信</div>
      <button class="qrcode-close" id="qrcodeClose">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- ========== 新建人设好友 ========== -->
  <div class="settings-page" id="personaPage">
    <div class="topbar">
      <button class="topbar-back" id="personaBack">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="topbar-title small" id="personaTitle">新建好友</span>
      <span style="width:28px"></span>
    </div>
    <div style="flex:1; overflow-y:auto" id="personaBody"></div>
  </div>

  <!-- ========== 新的朋友 ========== -->
  <div class="settings-page" id="friendsPage">
    <div class="topbar">

  // ── 渲染聊天列表 ──
  function renderChats() {
    var el = document.getElementById("chatList");
    el.innerHTML = chats.map(function(c) {
      var muteIcon = c.muted ? '<span style="margin-left:4px;color:#bbb">'+iconSvg("mute",14,"#bbb")+'</span>' : "";
      var badge = c.unread > 0 ? '<span class="list-badge'+(c.muted?" dot":"")+'">'+(c.muted?"":(c.unread > 99 ? "99+" : c.unread))+'</span>' : "";
      return '<div class="list-item no-indent" data-chat="'+c.id+'">' +
        '<img class="list-avatar" src="'+c.avatar+'" alt="">' +
        '<div class="list-content">' +
          '<div class="list-title-row"><span class="list-title">'+escapeHtml(c.name)+'</span><span class="list-time">'+c.time+'</span></div>' +
          '<div class="list-desc" style="display:flex;align-items:center;justify-content:space-between">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+escapeHtml(c.lastMsg)+'</span>' +
            muteIcon +
          '</div>' +
        '</div>' +
        badge +
      '</div>';
    }).join("");

    el.querySelectorAll("[data-chat]").forEach(function(item) {
      item.addEventListener("click", function() {
        var id = this.dataset.chat;
        var chat = chats.find(function(c) { return String(c.id) === String(id); });
        if (chat) openChat(chat.id);
      });
    });
  }

  // ── 渲染通讯录 ──
  function renderContacts() {
    var el = document.getElementById("contactList");
    var letters = [];
    var grouped = {};
    contacts.forEach(function(c) {
      if (!grouped[c.letter]) { grouped[c.letter] = []; letters.push(c.letter); }
      grouped[c.letter].push(c);
    });

    var specialHtml = specialContacts.map(function(sc) {
      return '<div class="list-item no-indent" data-special="'+sc.name+'">' +
        '<div class="list-icon" style="background:'+sc.color+'">'+iconSvg(sc.icon,22,"#fff")+'</div>' +
        '<div class="list-content"><span class="list-title">'+sc.name+'</span></div>' +
      '</div>';
    }).join("");

    var contactHtml = letters.map(function(L) {
      var items = grouped[L].map(function(c) {
        return '<div class="list-item" data-contact="'+escapeHtml(c.name)+'">' +
          '<img class="list-avatar" src="'+c.avatar+'" alt="">' +
          '<div class="list-content"><span class="list-title">'+escapeHtml(c.name)+'</span></div>' +
        '</div>';
      }).join("");
      return '<div class="alpha-header" id="letter-'+L+'">'+L+'</div>' + items;
    }).join("");

    el.innerHTML = '<div class="list-group" style="margin-top:0">'+specialHtml+'</div>' +
      '<div class="list-group">'+contactHtml+'</div>' +
      '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">'+contacts.length+' 位联系人</div>' +
      '<div class="alpha-index">' + letters.map(function(L) {
        return '<span data-letter="'+L+'">'+L+'</span>';
      }).join("") + '</div>';

    el.querySelectorAll("[data-contact]").forEach(function(item) {
      item.addEventListener("click", function() {
        openContactDetail(this.dataset.contact);
      });
    });

    el.querySelectorAll("[data-special]").forEach(function(item) {
      item.addEventListener("click", function() {
        var name = this.dataset.special;
        if (name === "新的朋友") openNewFriends();
        else if (name === "群聊") openDiscoverSub("群聊", "group");
        else if (name === "标签") openDiscoverSub("标签", "tag");
        else if (name === "公众号") openDiscoverSub("公众号", "article");
        else openDiscoverSub(name, "friends");
      });
    });

    el.querySelectorAll(".alpha-index span").forEach(function(s) {
      s.addEventListener("click", function() {
        var target = document.getElementById("letter-"+this.dataset.letter);
        if (target) target.scrollIntoView();
      });
    });
  }

  // ── 聊天详情 ──
  function openChat(id) {
    var chat = chats.find(function(c) { return String(c.id) === String(id); });
    if (!chat) return;
    if (chat.hidden) { chat.hidden = false; delete hiddenChats[String(chat.id)]; }
    currentChatId = chat.id;
    id = chat.id;
    document.getElementById("chatTitle").textContent = chat.name;
    var totalUnread = chats.reduce(function(s, c) { return s + c.unread; }, 0);
    document.getElementById("chatBackBadge").textContent = totalUnread > 99 ? "99+" : totalUnread;
    renderMessages(id);
    document.getElementById("chatDetail").classList.add("active");
    chat.unread = 0;
    renderChats();
    updateTabBadge();
    setTimeout(function() {
      var box = document.getElementById("chatMessages");
      box.scrollTop = box.scrollHeight;
    }, 50);
  }

  function closeChat() {
    document.getElementById("chatDetail").classList.remove("active");
    currentChatId = null;
  }

  function renderMessages(chatId) {
    var el = document.getElementById("chatMessages");
    var chat = chats.find(function(c) { return c.id === chatId; });
    var msgs = messages[chatId] || [
      { from: "other", text: chat.lastMsg, time: chat.time }
    ];
    var lastTime = "";
    el.innerHTML = msgs.map(function(m) {
      var timeHtml = "";
      if (m.time && m.time !== lastTime) {
        timeHtml = '<div class="chat-time">'+m.time+'</div>';
        lastTime = m.time;
      }
      var avatar = m.from === "me" ? me.avatar : chat.avatar;
      var extraCls = m.bubbleClass || "";
      if (m.image) extraCls = "img-bubble";
      else if (m.type === "sticker") extraCls = "sticker-msg";
      else if (m.type === "mediacard") extraCls = "mc-preview";
      else if (m.type === "location") extraCls = "loc-card";
      else if (m.type === "redpacket") extraCls = "redpacket-bubble";
      else if (m.type === "transfer") extraCls = "transfer-bubble";
      else if (m.type === "voice") extraCls = "voice-msg-bubble";
      var bubbleCls = "msg-bubble" + (extraCls ? " " + extraCls : "");
      var content;
      if (m.typing) {
        content = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      } else {
        content = messageContentHtml(m);
      }
      return timeHtml +
        '<div class="msg '+m.from+'">' +
          '<img class="msg-avatar" src="'+avatar+'" alt="">' +
          '<div class="'+bubbleCls+'">'+content+'</div>' +
        '</div>';
    }).join("");
  }

  // ── 各类消息内容渲染 ──
  function messageContentHtml(m) {
    if (m.image) {
      return '<img src="'+m.image+'" style="max-width:200px;border-radius:4px;display:block" alt="">';
    }
    if (m.type === "sticker") {
      if (m.url) {
        return '<img src="'+escapeHtml(m.url)+'" data-fb="'+escapeHtml(m.emoji||"🖼️")+'" alt="'+escapeHtml(m.stickerName||"表情")+'" onerror="stkImgFail(this)">';
      }
      return '<span class="stk-emoji-big">'+(m.emoji || "🖼️")+'</span>';
    }
    if (m.type === "mediacard") {
      return mediaCardInner(m.desc, m.media);
    }
    if (m.type === "location") {
      return '<div class="loc-map"><svg class="loc-pin" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>' +
        '<div class="loc-info"><div class="loc-name">'+escapeHtml(m.name||"当前位置")+'</div><div class="loc-addr">'+escapeHtml(m.address||"")+'</div></div>';
    }
    if (m.type === "redpacket") {

  function sceneHash(str) {
    var h = 7;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function buildSceneSVG(desc) {
    var palettes = [
      ["#ff9a9e","#fecfef"],["#a1c4fd","#c2e9fb"],["#fbc2eb","#a6c1ee"],
      ["#84fab0","#8fd3f4"],["#ffecd2","#fcb69f"],["#667eea","#764ba2"],
      ["#f6d365","#fda085"],["#43cea2","#185a9d"],["#30cfd0","#330867"],
      ["#ff758c","#ff7eb3"]
    ];
    var h = sceneHash(desc || "scene");
    var pal = palettes[h % palettes.length];
    var gid = "sg" + (h % palettes.length) + "_" + (h % 97);
    var showSun = h % 2 === 0;
    var showMountains = (h >> 1) % 2 === 0;
    var showClouds = (h >> 2) % 3 !== 0;
    var showBirds = (h >> 3) % 2 === 0;
    var deco = "";
    if (showSun) deco += '<circle cx="'+(h % 2 ? 160 : 44)+'" cy="42" r="22" fill="rgba(255,255,255,0.85)"/>';
    if (showClouds) deco += '<g fill="rgba(255,255,255,0.75)"><ellipse cx="52" cy="40" rx="22" ry="10"/><ellipse cx="72" cy="34" rx="16" ry="9"/><ellipse cx="150" cy="62" rx="20" ry="9"/></g>';
    if (showMountains) {
      deco += '<path d="M0 150 L45 95 L85 130 L125 80 L170 125 L200 100 L200 150 Z" fill="rgba(0,0,0,0.18)"/>';
      deco += '<path d="M0 150 L35 115 L75 140 L120 105 L165 140 L200 118 L200 150 Z" fill="rgba(0,0,0,0.28)"/>';
    } else {
      deco += '<path d="M0 130 Q50 110 100 125 T200 120 L200 150 L0 150 Z" fill="rgba(255,255,255,0.35)"/>';
      deco += '<path d="M0 140 Q60 125 120 138 T200 135 L200 150 L0 150 Z" fill="rgba(255,255,255,0.25)"/>';
    }
    if (showBirds) deco += '<g fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"><path d="M96 52 q5 -6 10 0 q5 -6 10 0"/><path d="M128 42 q4 -5 8 0 q4 -5 8 0"/></g>';
    return '<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+pal[0]+'"/><stop offset="1" stop-color="'+pal[1]+'"/></linearGradient></defs><rect width="200" height="150" fill="url(#'+gid+')"/>'+deco+'</svg>';
  }
  function mediaCardInner(desc, media) {
    var tag = media === "video"
      ? '<div class="mc-type-tag"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>视频</div>'

  function scheduleReply(chat, userText) {
    if (!chat || chat.isService) return;
    var cid = chat.id;
    var isPersonaChat = chat.isPersona || chat.persona;
    setTimeout(function() {
      if (!messages[cid]) return;
      messages[cid].push({ from: "other", typing: true });
      showTypingHeader(true);
      renderMessages(cid);
      var box = document.getElementById("chatMessages");
      box.scrollTop = box.scrollHeight;
    }, 700);
    if (isPersonaChat && callTextApi) {
      // 真正调 AI API
      callTextApi(personaSystemPrompt(chat, ""), userText).then(function(reply) {
        if (!messages[cid]) return;
        // 移除 typing
        for (var i = messages[cid].length - 1; i >= 0; i--) {
          if (messages[cid][i].typing) { messages[cid].splice(i, 1); break; }
        }
        showTypingHeader(false);
        var finalReply = reply || generateReply(userText, chat);
        messages[cid].push({ from: "other", text: finalReply });
        var target = chats.find(function(c) { return c.id === cid; });
        if (target) { target.lastMsg = finalReply; target.time = "刚刚"; }
        renderMessages(cid);
        renderChats();
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
        // 自动回表情包
        if (stickerStore.autoReply) {
          var st = pickStickerForContext(userText, finalReply);
          if (st) {
            setTimeout(function() {
              if (!messages[cid]) return;
              messages[cid].push({ from: "other", type: "sticker", url: st.url || "", emoji: st.emoji || "", stickerName: st.name || "" });
              var t2 = chats.find(function(c) { return c.id === cid; });
              if (t2) { t2.lastMsg = "[表情]"; t2.time = "刚刚"; }
              renderMessages(cid); renderChats();
              var b2 = document.getElementById("chatMessages");
              b2.scrollTop = b2.scrollHeight;
            }, 900);
          }
        }
      }).catch(function() {
        if (!messages[cid]) return;
        for (var i = messages[cid].length - 1; i >= 0; i--) {
          if (messages[cid][i].typing) { messages[cid].splice(i, 1); break; }
        }
        showTypingHeader(false);
        var fallback = generateReply(userText, chat);
        messages[cid].push({ from: "other", text: fallback });
        var target = chats.find(function(c) { return c.id === cid; });
        if (target) { target.lastMsg = fallback; target.time = "刚刚"; }
        renderMessages(cid); renderChats();
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
      });
    } else {
      // 非人设聊天，用模板回复
      setTimeout(function() {
        if (!messages[cid]) return;
        for (var i = messages[cid].length - 1; i >= 0; i--) {
          if (messages[cid][i].typing) { messages[cid].splice(i, 1); break; }
        }
        showTypingHeader(false);
        var reply = generateReply(userText, chat);
        messages[cid].push({ from: "other", text: reply });
        var target = chats.find(function(c) { return c.id === cid; });
        if (target) { target.lastMsg = reply; target.time = "刚刚"; }
        renderMessages(cid);
        renderChats();
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
        if (stickerStore.autoReply) {
          var st = pickStickerForContext(userText, reply);
          if (st) {
            setTimeout(function() {
              if (!messages[cid]) return;
              messages[cid].push({ from: "other", type: "sticker", url: st.url || "", emoji: st.emoji || "", stickerName: st.name || "" });
              var t2 = chats.find(function(c) { return c.id === cid; });
              if (t2) { t2.lastMsg = "[表情]"; t2.time = "刚刚"; }
              renderMessages(cid); renderChats();
              var b2 = document.getElementById("chatMessages");

  // ── 人设感知回复生成 ──
  function generateReply(userText, chat) {
    var persona = (chat && chat.persona) || "";
    var p = persona.toLowerCase();
    var isQ = /[?？吗呢么]/.test(userText);
    var greet = /^(在吗|你好|嗨|hi|hello|在)/i.test(userText);

    // 语气池
    var tone = {
      warm:   ["我在呢，慢慢说", "嗯，我听着呢", "你说的我都懂", "别担心，有我呢", "今天也辛苦啦", "我一直都在"],
      funny:  ["哈哈哈哈这也太真实了", "笑死，你怎么这么有才", "我怀疑你在开车但我没有证据", "安排！", "这波我给满分", "你这话我没法接哈哈哈"],
      cool:   ["嗯", "知道了", "行", "哦", "随你", "再说吧", "可以"],
      cute:   ["哇～", "好呀好呀", "嗯嗯！", "嘿嘿", "收到啦", "爱你哟"],
      normal: ["好的", "收到", "嗯嗯", "哈哈", "行，我知道了", "稍等", "在的", "好呀", "没问题", "明白了"]
    };
    var pool = tone.normal;
    if (/温柔|暖|体贴|治愈|安静|文艺/.test(persona)) pool = tone.warm;
    else if (/幽默|搞笑|逗|有趣|沙雕|活泼/.test(persona)) pool = tone.funny;
    else if (/高冷|酷|冷淡|沉默|少言|霸道/.test(persona)) pool = tone.cool;
    else if (/可爱|萌|甜|软|萝莉|元气/.test(persona)) pool = tone.cute;

    if (greet) {
      if (pool === tone.cool) return "嗯？";
      if (pool === tone.warm) return "在的，怎么啦？";
      return "在呢，怎么啦？";
    }
    if (isQ) {
      if (pool === tone.cool) return "嗯，我看看";
      if (pool === tone.warm) return "让我想想……我觉得跟着心走就好";
      return "我看看，稍后回你";
    }
    if (userText.length > 20) {
      if (pool === tone.cool) return "了解了";
      if (pool === tone.warm) return "谢谢你愿意跟我说这些";
      return "了解，我仔细看看";
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ── 角色根据上下文自动回表情 ──
  function pickStickerForContext(userText, replyText) {
    var all = stkAll();
    if (!all.length) return null;
    var hay = (userText || "") + " " + (replyText || "");
    var direct = all.find(function(s) { return s.name && s.name.length >= 2 && hay.indexOf(s.name) >= 0; });
    if (direct) return direct;
    var moodMap = [
      [/哈哈|嘻嘻|开心|高兴|笑|逗/, ["开心","大笑","鼓掌"]],
      [/喜欢|爱|么么|赞|棒|厉害|牛|感谢|谢谢/, ["喜欢","点赞","鼓掌"]],
      [/好的|收到|没问题|可以|行|ok|OK|嗯/, ["点赞","OK","开心"]],
      [/晚安|睡觉|睡了|休息/, ["晚安"]],
      [/哭|难过|伤心|委屈|痛/, ["哭泣"]],
      [/生气|气死|烦|讨厌/, ["生气"]],
      [/惊讶|什么？|真的吗|卧槽|不会吧/, ["惊讶"]],
      [/红包|发财|钱|转账/, ["红包"]],
      [/加油|努力|冲|奋斗/, ["加油"]],
      [/在吗|早安|早|你好/, ["开心"]]
    ];
    for (var i = 0; i < moodMap.length; i++) {
      if (moodMap[i][0].test(hay)) {
        var cand = all.filter(function(s) {
          return moodMap[i][1].some(function(n) { return s.name && s.name.indexOf(n) >= 0; });
        });
        if (cand.length) return cand[Math.floor(Math.random() * cand.length)];
      }
    }
    return null;
  }

  function createStickerGroup() {
    var name = prompt("新建表情分组，请输入分组名称：", "新分组");
    if (name === null) return;
    name = name.trim();
    if (!name) return showToast("请输入分组名称");
    stickerStore.groups.push({ id: "g_" + Date.now(), name: name, builtin: false, expanded: true, stickers: [] });

  function parseStickerLines(text) {
    var out = [];
    (text || "").split(/\n+/).forEach(function(line) {
      line = line.trim();
      if (!line) return;
      var m = line.match(/^\s*([^:：]+?)\s*[：:]\s*(https?:\/\/\S+)\s*$/);
      if (m) out.push({ id: "s_" + Date.now() + "_" + out.length, name: m[1].trim(), url: m[2].trim(), emoji: "", fav: false });
    });
    return out;
  }
  function importStickers(gid) {
    var ta = document.getElementById("stkImport_" + gid);
    var parsed = parseStickerLines(ta ? ta.value : "");
    if (!parsed.length) return showToast("未识别到有效内容，请按 名称：链接 每行一个");
    var g = stickerStore.groups.find(function(x) { return x.id === gid; });
    if (!g) return;
    g.stickers = g.stickers.concat(parsed);
    g.expanded = true;
    stkSave(); renderStickerPage();
    showToast("成功导入 " + parsed.length + " 个表情包");
  }

    var url = prompt("图片链接（https://...）：", "");
    if (url === null) return;
    url = url.trim();
    if (!/^https?:\/\/\S+$/.test(url)) return showToast("请输入正确的图片链接");
    var g = stickerStore.groups.find(function(x) { return x.id === gid; });
    if (!g) return;
    g.stickers.push({ id: "s_" + Date.now(), name: name, url: url, emoji: "", fav: false });

    stkSave(); renderStickerPage(); showToast("已添加");

  function personaAppearanceDesc(persona) {
    if (persona.appearance && persona.appearance.trim()) return persona.appearance.trim();
    return persona.gender === "male" ? "一个年轻男生，短发，干净清爽" : "一个年轻女生，自然妆容，清新";
  }

  function personaPost(persona) {
    var topic = MOMENT_TOPICS[Math.floor(Math.random() * MOMENT_TOPICS.length)];
    var app = personaAppearanceDesc(persona);
    var raw = topic.prompts.slice();
    // 洗牌后取 1~3 个
    for (var i = raw.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = raw[i]; raw[i] = raw[j]; raw[j] = t;
    }
    var n = raw.length === 0 ? 0 : (1 + Math.floor(Math.random() * Math.min(3, raw.length)));
    var imagePrompts = raw.slice(0, n).map(function(p) { return p.replace(/\{app\}/g, app); });
    var post = {
      id: "mp_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
      author: persona.name, avatar: persona.avatar,
      text: topic.text, images: [], imagePrompts: imagePrompts.slice(),
      time: "刚刚", likes: [], comments: [], liked: false,
      isPersonaPost: true, personaId: persona.id
    };
    posts.unshift(post);
    savePosts();
    renderMoments();
    // 自动生成配图：逐个调用图像 API，完成后替换 prompt 卡片为真实图片
    if (imagePrompts.length > 0 && apiConfig.image && apiConfig.image.enabled && apiConfig.image.key) {
      imagePrompts.forEach(function(prompt, idx) {
        generateImageSrc(prompt, "1024x1024").then(function(url) {
          var p = findPost(post.id);
          if (!p) return;
          var imgs = p.images || (p.images = []);
          var prms = p.imagePrompts || (p.imagePrompts = []);
          // 找到对应 prompt 并移除，加入 images
          var at = prms.indexOf(prompt);
          if (at >= 0) prms.splice(at, 1);
          imgs.push(url || fallbackImageSrc(prompt));
          if (!url) console.warn("角色动态配图生成失败，使用占位图");
          savePosts();
          renderMoments();
        });
      });
    }
  }

    var now = Date.now(), changed = false;

      if (!personaSchedule[p.id]) {
        personaSchedule[p.id] = now + MOMENT_FIRST_DELAY + Math.random() * 30000;
        changed = true;
      }
      if (now >= personaSchedule[p.id]) {
        try { personaPost(p); } catch (e) { console.warn("角色动态生成失败：", e); }
        personaSchedule[p.id] = now + MOMENT_INTERVAL_MIN + Math.random() * (MOMENT_INTERVAL_MAX - MOMENT_INTERVAL_MIN);
        changed = true;
      }
    });

  function findPost(postId) {
    return posts.find(function(p) { return String(p.id) === String(postId); });
  }
  function generateMomentImage(postId, gIdx, card) {
    var post = findPost(postId);
    if (!post) return;
    var imgs = post.images || (post.images = []);
    var prompts = post.imagePrompts || (post.imagePrompts = []);
    var pIdx = gIdx - imgs.length;
    var prompt = prompts[pIdx];
    if (!prompt || card.classList.contains("loading")) return;
    card.classList.add("loading");
    var genBtn = card.querySelector(".pending-gen");
    genBtn.disabled = true;
    genBtn.innerHTML = '<span class="pending-spinner"></span>生成中';
    callImageApi(prompt, "1024x1024").then(function(url) {
      var at = prompts.indexOf(prompt);
      if (at < 0) return; // 等待期间被删除
      prompts.splice(at, 1);
      imgs.push(url || fallbackImageSrc(prompt));
      if (!url) showToast("图像 API 未配置或失败，已用本地占位图");
      savePosts();
      renderMoments();
    });
  }
  function deleteMomentPrompt(postId, gIdx) {
    var post = findPost(postId);
    if (!post) return;
    var imgs = post.images || [];
    var prompts = post.imagePrompts || [];
    var pIdx = gIdx - imgs.length;
    if (pIdx < 0 || pIdx >= prompts.length) return;
    prompts.splice(pIdx, 1);
    savePosts();
    renderMoments();
  }

  function openFieldEditor(field) {

    document.getElementById("fieldTitle").textContent = conf.title;
    var input = document.getElementById("fieldInput");
    var ta = document.getElementById("fieldTextarea");

    var count = document.getElementById("fieldCount");
    input.style.display = "none"; ta.style.display = "none"; gender.style.display = "none"; count.style.display = "none";
    if (conf.type === "input") {
      input.type = "text"; input.value = me[field] || ""; input.placeholder = conf.placeholder;
      input.maxLength = conf.max || 50;
      input.style.display = "block";
    } else if (conf.type === "textarea") {
      ta.value = me[field] || ""; ta.placeholder = conf.placeholder;
      ta.maxLength = conf.max || 100;
      ta.style.display = "block";
      count.style.display = "block";
      updateFieldCount();

  function showMessageContext(x, y, bubble) {
    removeContextMenu();
    var menu = document.createElement("div");
    menu.className = "context-menu";
    menu.id = "contextMenu";
    menu.innerHTML =
      '<button class="context-menu-item" data-act="copy">复制</button>' +
      '<button class="context-menu-item" data-act="forward">转发</button>' +
      '<button class="context-menu-item" data-act="favorite">收藏</button>' +
      '<button class="context-menu-item" data-act="quote">引用</button>' +
      '<button class="context-menu-item" data-act="translate">翻译</button>' +
      '<button class="context-menu-item danger" data-act="delete">删除</button>';
    menu.style.left = Math.min(x, window.innerWidth - 140) + "px";
    menu.style.top = Math.min(y - 100, window.innerHeight - 280) + "px";
    document.body.appendChild(menu);
    menu.querySelectorAll(".context-menu-item").forEach(function(item) {
      item.addEventListener("click", function() {
        var act = this.dataset.act;
        if (act === "copy") {
          var text = bubble.textContent;
          if (navigator.clipboard) navigator.clipboard.writeText(text);
          showToast("已复制");
        } else if (act === "delete") {
          bubble.closest(".msg").style.opacity = "0";
          setTimeout(function() { bubble.closest(".msg").remove(); }, 200);
        } else if (act === "favorite") {
          var chat = chats.find(function(c) { return c.id === currentChatId; });
          addFavorite({ type: "text", title: chat ? chat.name : "聊天消息", desc: bubble.textContent });
        } else {
          showToast(this.textContent);
        }
        removeContextMenu();
      });
    });
    setTimeout(function() {
      document.addEventListener("click", removeContextMenu, { once: true });
    }, 10);
  }
  function removeContextMenu() {

  function setupHoldToTalk(btn) {
    var overlay = document.getElementById("voiceOverlay");
    var voiceIcon = document.getElementById("voiceIcon");
    var voiceText = document.getElementById("voiceText");
    var cancelled = false;
    var startY = 0;

    function start(e) {
      e.preventDefault();
      cancelled = false;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      overlay.classList.add("active");
      voiceIcon.classList.add("recording");
      voiceText.textContent = "手指上滑，取消发送";
      voiceText.style.color = "";
    }
    function move(e) {
      if (!overlay.classList.contains("active")) return;
      var y = e.touches ? e.touches[0].clientY : e.clientY;
      if (startY - y > 80) {
        cancelled = true;
        voiceIcon.classList.remove("recording");
        voiceText.textContent = "松开手指，取消发送";
        voiceText.style.color = "#fa5151";
      } else {
        cancelled = false;
        voiceIcon.classList.add("recording");
        voiceText.textContent = "手指上滑，取消发送";
        voiceText.style.color = "";
      }
    }
    function end() {
      overlay.classList.remove("active");
      voiceIcon.classList.remove("recording");
      if (!cancelled) {
        if (!messages[currentChatId]) messages[currentChatId] = [];
        messages[currentChatId].push({ from: "me", text: "[语音]" });
        var chat = chats.find(function(c) { return c.id === currentChatId; });
        if (chat) chat.lastMsg = "[语音]";
        renderMessages(currentChatId);
        renderChats();
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
      }
    }
    btn.addEventListener("touchstart", start, { passive: false });
    btn.addEventListener("touchmove", move, { passive: true });
    btn.addEventListener("touchend", end);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mousemove", move);
    btn.addEventListener("mouseup", end);
    btn.addEventListener("mouseleave", function() {
      if (overlay.classList.contains("active")) end();
    });
  }

    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
      body: JSON.stringify({
        model: cfg.model || "gpt-4o-mini",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userText }
        ]
      })
    }).then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j) {
        return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || null;
      })
      .catch(function(e) { console.warn("文本 API 失败：", e); return null; });

  // 读取本地图片并等比压缩（最长边 maxSize），输出 dataURL；环境不支持 canvas 时回退原图
  function readImageFileScaled(file, maxSize, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    var done = false;
    function finish(v) { if (!done) { done = true; cb(v); } }
    try {
      var reader = new FileReader();
      reader.onload = function(e) {
        var raw = e.target.result;
        try {
          var img = new Image();
          var timer = setTimeout(function() { finish(raw); }, 1500);
          img.onload = function() {
            clearTimeout(timer);
            try {
              var iw = img.width || maxSize, ih = img.height || maxSize;
              var scale = Math.min(1, maxSize / Math.max(iw, ih));
              var w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
              var canvas = document.createElement("canvas");
              canvas.width = w; canvas.height = h;
              var ctx = canvas.getContext("2d");
              if (!ctx) throw new Error("no 2d context");
              ctx.drawImage(img, 0, 0, w, h);
              var out = canvas.toDataURL("image/jpeg", 0.85);
              finish(out && out.length > 100 ? out : raw);
            } catch (err) { finish(raw); }
          };
          img.onerror = function() { clearTimeout(timer); finish(raw); };
          img.src = raw;
        } catch (err) { finish(raw); }
      };
      reader.onerror = function() { finish(null); };
      reader.readAsDataURL(file);
    } catch (err) { finish(null); }
  }

  // ── 真实音量检测（Web Audio AnalyserNode） ──
  function setupCallAudioMeter(stream) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      callAudioCtx = new AC();
      var source = callAudioCtx.createMediaStreamSource(stream);
      callAnalyser = callAudioCtx.createAnalyser();
      callAnalyser.fftSize = 256;
      callAnalyser.smoothingTimeConstant = 0.6;
      source.connect(callAnalyser);
      var data = new Uint8Array(callAnalyser.frequencyBinCount);
      var spans = document.querySelectorAll("#callVol span");
      var tick = function() {
        callAnalyser.getByteFrequencyData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) sum += data[i];
        var level = Math.min(1, (sum / data.length / 255) * 3.2);
        paintVol(spans, level);
        callRafId = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) {
      startFakeAudioMeter();
    }
  }
  // ── 降级：模拟音量波动 ──
  function startFakeAudioMeter() {
    var spans = document.querySelectorAll("#callVol span");
    var t = 0;
    var tick = function() {
      t += 0.15;
      var level = 0.35 + Math.abs(Math.sin(t)) * 0.6;
      paintVol(spans, level);
      callRafId = requestAnimationFrame(tick);
    };
    tick();
  }
  function paintVol(spans, level) {
    for (var i = 0; i < spans.length; i++) {
      var center = 1 - Math.abs(i - (spans.length - 1) / 2) / ((spans.length - 1) / 2);
      var h = 5 + level * center * 17;
      spans[i].style.height = h + "px";
      spans[i].style.opacity = (0.35 + level * 0.65).toFixed(2);
    }
  }

  function endCall() {

    if (callRafId) { cancelAnimationFrame(callRafId); callRafId = null; }
    if (callStream) {
      callStream.getTracks().forEach(function(t) { try { t.stop(); } catch (e) {} });
      callStream = null;
    }
    if (callAudioCtx) { try { callAudioCtx.close(); } catch (e) {} callAudioCtx = null; callAnalyser = null; }
    var lv = document.getElementById("callLocalVideo");
    if (lv) { try { lv.pause(); lv.srcObject = null; lv.src = ""; } catch (e) {} }

  function buildQrSvg(seed) {
    var h = sceneHash(seed || "pay");
    var cells = 21, size = 9;
    var rects = "";
    function finder(x, y) {
      return '<rect x="'+(x*size)+'" y="'+(y*size)+'" width="'+(7*size)+'" height="'+(7*size)+'" fill="none" stroke="#111" stroke-width="'+size+'"/>' +
             '<rect x="'+((x+2)*size)+'" y="'+((y+2)*size)+'" width="'+(3*size)+'" height="'+(3*size)+'" fill="#111"/>';
    }
    for (var y = 0; y < cells; y++) {
      for (var x = 0; x < cells; x++) {
        var inFinder = (x < 8 && y < 8) || (x > cells-9 && y < 8) || (x < 8 && y > cells-9);
        if (inFinder) continue;
        if (((h >> ((x*7 + y*3) % 30)) & 1) || ((x*y + x + y) % 3 === 0)) {
          rects += '<rect x="'+(x*size)+'" y="'+(y*size)+'" width="'+size+'" height="'+size+'" fill="#111"/>';
        }
      }
    }
    var dim = cells * size;
    return '<svg width="200" height="200" viewBox="0 0 '+dim+' '+dim+'" xmlns="http://www.w3.org/2000/svg"><rect width="'+dim+'" height="'+dim+'" fill="#fff"/>' +
      finder(0,0) + finder(cells-7,0) + finder(0,cells-7) + rects + '</svg>';
  }

// ── TTS：OpenAI 兼容 /audio/speech，失败返回 null ──
function callTtsApi(text) {
  var cfg = apiConfig.voice;
  if (!cfg.enabled || !cfg.baseUrl || !cfg.key) return Promise.resolve(null);
  var url = cfg.baseUrl.replace(/\/+$/, "") + "/audio/speech";
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
    body: JSON.stringify({
      model: cfg.model || "tts-1",
      voice: cfg.voiceId || "alloy",
      input: String(text || "").slice(0, 600),
      response_format: "mp3"
    })
  }).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.blob();
  }).then(function(blob) {
    return URL.createObjectURL(blob);
  }).catch(function(e) { console.warn("TTS API 失败：", e); return null; });
}

var __ttsAudio = null;
function stopTts() {
  try {
    if (__ttsAudio) { __ttsAudio.pause(); __ttsAudio = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  } catch (e) {}
}
// 播放语音：TTS 优先，未配置/失败降级浏览器朗读，再不行返回 false
function speakText(text, opts) {
  opts = opts || {};
  return new Promise(function(resolve) {
    if (opts.muted) { resolve(false); return; }
    callTtsApi(text).then(function(url) {
      if (opts.muted) { resolve(false); return; }
      if (url) {
        stopTts();
        var a = new Audio(url);
        __ttsAudio = a;
        a.onended = function() { __ttsAudio = null; resolve(true); };
        a.onerror = function() {
          __ttsAudio = null;
          if (speakLocal(text)) { setTimeout(function(){resolve(true);}, 1200); } else resolve(false);
        };
        a.play().catch(function() {
          __ttsAudio = null;
          if (speakLocal(text)) { setTimeout(function(){resolve(true);}, 1200); } else resolve(false);
        });
      } else {
        var ok = speakLocal(text);
        resolve(!!ok);
      }
    });
  });
  function speakLocal(t) {
    try {
      if (window.speechSynthesis && "SpeechSynthesisUtterance" in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t);
        u.lang = "zh-CN"; u.rate = 1.05;
        window.speechSynthesis.speak(u);
        return true;
      }
    } catch (e) {}
    return false;
  }
}

function incomingMessage(chat, msgObj) {
  if (!chat) return;
  chat.hidden = false;
  delete hiddenChats[String(chat.id)];
  if (!messages[chat.id]) messages[chat.id] = [];
  if (!msgObj.time) msgObj.time = "刚刚";

    renderMessages(chat.id);

    box.scrollTop = box.scrollHeight;
    chat.unread = 0;
  } else {
    chat.unread = (chat.unread || 0) + 1;
  }
  var preview = msgPreview(msgObj);
  chat.lastMsg = preview;
  chat.time = "刚刚";
  saveChatsState();
  renderChats();
  updateTabBadge();
}
function msgPreview(m) {
  if (m.typing) return "对方正在输入…";
  if (m.type === "redpacket") return "[微信红包]";
  if (m.type === "transfer") return "[转账] ¥" + (m.amount || "0.00");
  if (m.type === "voice") return "[语音]";
  if (m.type === "sticker") return "[表情]";
  if (m.image || m.type === "mediacard") return "[图片]";
  if (m.type === "location") return "[位置]";
  if (m.type === "callrec") return (m.video ? "[视频通话] " : "[语音通话] ") + (m.durationText || "");
  return m.text || "";
}

// ── AI 生成 JSON（文本 API 返回 JSON 对象），失败返回 null ──
function callTextJson(systemPrompt, userPrompt) {
  return callTextApi(systemPrompt, userPrompt).then(function(txt) {
    if (!txt) return null;
    try {
      var s = txt.replace(/^[^{]*/, "").replace(/[^}]*$/, "");
      return JSON.parse(s);
    } catch (e) {
      var m = txt.match(/\{[\s\S]*\}/);
      if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
      return null;
    }
  });
}

function startRingSound() {
  try {
    stopRingSound();
    var AC = window.AudioContext || window.webkitAudioContext;
    callRingCtx = new AC();
    function beep() {
      if (!callRingCtx) return;
      var o = callRingCtx.createOscillator(), g = callRingCtx.createGain();
      o.frequency.value = 520; o.type = "sine";
      g.gain.setValueAtTime(0.0001, callRingCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, callRingCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, callRingCtx.currentTime + 0.8);
      o.connect(g); g.connect(callRingCtx.destination);
      o.start(); o.stop(callRingCtx.currentTime + 0.9);
    }
    beep();
    callRingTimer = setInterval(beep, 1800);
  } catch (e) {}
}
function stopRingSound() {
  try { if (callRingTimer) { clearInterval(callRingTimer); callRingTimer = null; } } catch (e) {}
  try { if (callRingCtx) { callRingCtx.close(); callRingCtx = null; } } catch (e) {}
}

function setupCallVoiceInput(btn) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    btn.addEventListener("click", function() { showToast("当前浏览器不支持语音识别，请用文字回复"); });
    btn.style.opacity = "0.5";
    return;
  }
  var rec = null, listening = false;
  function start(e) {
    e.preventDefault();
    if (listening) return;
    try {
      rec = new SR();
      rec.lang = "zh-CN"; rec.interimResults = false;
      rec.onresult = function(ev) {
        var t = ev.results[0][0].transcript;
        var inp = document.querySelector("#callReplyBox #callTextInput");
        if (inp) inp.value = t;
        showToast("识别：" + t);
      };
      rec.onerror = function() { listening = false; btn.style.background = "rgba(255,255,255,0.18)"; };
      rec.onend = function() { listening = false; btn.style.background = "rgba(255,255,255,0.18)"; };
      rec.start();
      listening = true;
      btn.style.background = "#07c160";
    } catch (e) { listening = false; }
  }
  function end() {
    if (rec && listening) { try { rec.stop(); } catch (e) {} }
    listening = false;
    btn.style.background = "rgba(255,255,255,0.18)";
  }
  btn.addEventListener("touchstart", start, { passive: false });
  btn.addEventListener("touchend", end);
  btn.addEventListener("mousedown", start);
  btn.addEventListener("mouseup", end);
  btn.addEventListener("mouseleave", function() { if (listening) end(); });
}

function showSimFullscreen(opt) {
  var fs = document.getElementById("simFullscreen");
  document.getElementById("simTitle").textContent = opt.mode === "live" ? "直播" : "视频号";
  var bg = document.getElementById("simBg");
  if (opt.bg.indexOf("data:image/svg") === 0) {
    bg.innerHTML = opt.bg;
  } else {
    bg.innerHTML = '<img src="' + opt.bg + '" style="width:100%;height:100%;object-fit:cover" alt="">';
    var bgImg = bg.querySelector("img");
    bgImg.onerror = function() { this.onerror = null; this.src = fallbackImageSrc(opt.title || "live"); };
  }
  document.getElementById("danmakuLayer").innerHTML = "";
  document.getElementById("simHostName").textContent = opt.host ? opt.host.name : "";
  document.getElementById("simHost").style.display = opt.mode === "live" ? "flex" : "none";
  var av = document.getElementById("simHostAvatar");
  av.innerHTML = opt.hostAvatar ? '<img src="' + opt.hostAvatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" alt="">' : "";
  var center = document.getElementById("simCenter");
  center.style.display = opt.mode === "video" ? "flex" : "none";
  var actions = document.getElementById("simActions");
  if (opt.mode === "live") {
    actions.innerHTML =
      simActBtn("heart", "点赞", "#fa5151") +
      simActBtn("gift", "礼物", "#ffce3b") +
      simActBtn("chat", "说点什么", "#fff") +
      simActBtn("share", "分享", "#fff");
    actions.querySelector("[data-sact=\"gift\"]").addEventListener("click", function() { sendGift(opt.host); });
    actions.querySelector("[data-sact=\"heart\"]").addEventListener("click", function() { floatHeart(); });
    actions.querySelector("[data-sact=\"chat\"]").addEventListener("click", function() {
      var t = prompt("发个弹幕：", "主播好棒");
      if (t) addDanmaku(me.name + "：" + t, true);
    });
    actions.querySelector("[data-sact=\"share\"]").addEventListener("click", function() { showToast("已分享"); });
    document.getElementById("simFollow").onclick = function() {
      this.textContent = this.textContent === "关注" ? "已关注" : "关注";
      showToast(this.textContent === "已关注" ? "已关注" : "已取消关注");
    };
  } else {
    actions.innerHTML =
      simActBtn("heart", "点赞", "#fa5151") +
      simActBtn("comment", "评论", "#fff") +
      simActBtn("share", "转发", "#fff");
    actions.querySelector("[data-sact=\"heart\"]").addEventListener("click", function() {
      var c = this.querySelector(".circle");
      c.style.background = "#fa5151";
      floatHeart();
      showToast("已点赞");
    });
    actions.querySelector("[data-sact=\"comment\"]").addEventListener("click", function() {
      var t = prompt("写评论：", "");
      if (t) addDanmaku(me.name + "：" + t, true);
    });
    actions.querySelector("[data-sact=\"share\"]").addEventListener("click", function() { showToast("已转发"); });
    center.onclick = function() { showToast("视频流为占位演示，封面已由 AI 生成"); };
  }
  fs.classList.add("active");
  if (opt.mode === "live") startLiveSimulation(opt.host);
  liveTimers.push(setTimeout(function() {
    addDanmaku((opt.host ? opt.host.name : "主播") + "：欢迎来到直播间～", false, true);
  }, 800));
}

function addDanmaku(text, isMine, isHost) {
  var layer = document.getElementById("danmakuLayer");
  if (!layer || !document.getElementById("simFullscreen").classList.contains("active")) return;
  var d = document.createElement("div");
  d.className = "danmaku";
  d.style.top = (8 + Math.random() * 62) + "%";
  d.style.animationDuration = (7 + Math.random() * 5) + "s";
  d.style.color = isHost ? "#ffd666" : (isMine ? "#8affd0" : "#fff");
  d.textContent = text;

  setTimeout(function() { if (d.parentNode) d.remove(); }, 13000);

  var fs = document.getElementById("simFullscreen");

  g.className = "gift-fly";
  g.innerHTML = '<div style="background:linear-gradient(135deg,#ffce3b,#ff9d3b);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,0.3)">' +

function sendGift(host) {
  var gift = LIVE_GIFT_NAMES[Math.floor(Math.random() * LIVE_GIFT_NAMES.length)];
  flyGift(gift);
  addDanmaku(me.name + " 送出了" + gift + " x1", true);
  // 主播即时感谢（文本 + TTS）
  setTimeout(function() {
    var sys = "你是直播间主播「" + host.name + "」，人设：" + host.persona + "。观众" + me.name + "刚给你送了礼物「" + gift + "」，" +
      "请用一句直播口播感谢观众，热情、口语化、30字以内，不要emoji。";
    callTextApi(sys, "感谢送礼").then(function(line) {
      line = line || ("感谢" + me.name + "送的" + gift + "，么么哒！");
      addDanmaku(host.name + "：" + line, false, true);
      speakText(line);
    });
  }, 900);
}
function startLiveSimulation(host) {
  liveTimers.forEach(clearTimeout);
  liveTimers = [];
  function viewerDanmaku() {
    if (!document.getElementById("simFullscreen").classList.contains("active")) return;
    var viewer = LIVE_VIEWERS[Math.floor(Math.random() * LIVE_VIEWERS.length)];
    var sys = "你是直播间观众，正在看主播「" + host.name + "」直播（" + host.topic + "）。" +
      "发一条弹幕，口语、简短（15字以内），像真实观众发的，可以是捧场、提问或闲聊，不要emoji，只输出弹幕内容。";
    callTextApi(sys, "生成一条观众弹幕").then(function(line) {
      if (!document.getElementById("simFullscreen").classList.contains("active")) return;
      addDanmaku(viewer + "：" + (line || (["主播好！", "来了来了", "哈哈哈哈", "主播唱一个", "今天也很好看"][Math.floor(Math.random() * 5)])));
    });
    liveTimers.push(setTimeout(viewerDanmaku, 2600 + Math.random() * 3200));
  }
  function hostSay() {
    if (!document.getElementById("simFullscreen").classList.contains("active")) return;
    var sys = "你是直播间主播「" + host.name + "」，人设：" + host.persona + "，直播主题：" + host.topic + "。" +
      "说一句直播时会说的话（欢迎观众、聊天、互动），口语化、30字以内，不要emoji，只输出台词。";
    callTextApi(sys, "主播说句话").then(function(line) {
      if (!document.getElementById("simFullscreen").classList.contains("active")) return;
      line = line || ("欢迎新来的朋友，今天我们聊" + host.topic);
      addDanmaku(host.name + "：" + line, false, true);
      speakText(line);
    });
    liveTimers.push(setTimeout(hostSay, 9000 + Math.random() * 9000));
  }
  liveTimers.push(setTimeout(viewerDanmaku, 2200));
  liveTimers.push(setTimeout(hostSay, 6000));
  // 自动飘心
  liveTimers.push(setInterval(function() {
    if (document.getElementById("simFullscreen").classList.contains("active") && Math.random() < 0.5) floatHeart();
  }, 3500));
}
function closeSimFullscreen() {
  document.getElementById("simFullscreen").classList.remove("active");
  liveTimers.forEach(function(t) { clearTimeout(t); clearInterval(t); });
  liveTimers = [];
  stopTts();
}

function initJumpGame() {
  var canvas = document.getElementById("jumpCanvas");
  if (!canvas) return;
  canvas.width = canvas.offsetWidth || 360;
  var ctx = canvas.getContext("2d"), W = canvas.width, H = 320;
  var state = { boxes: [60, 170, 280], cur: 0, score: 0, charge: 0, charging: false, y: 0 };
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f7f7f7"; ctx.fillRect(0, H - 60, W, 60);
    state.boxes.forEach(function(x, i) {
      ctx.fillStyle = i === state.cur ? "#07c160" : "#8fd3a8";
      ctx.fillRect(x, H - 100, 46, 40);
    });
    // 小人
    var px = state.boxes[state.cur] + 23;
    var py = H - 110 - state.y - state.charge * 40;
    ctx.fillStyle = "#333";
    ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(px - 5, py, 10, 18);
    ctx.fillStyle = "#fa5151";
    ctx.font = "16px sans-serif";
    ctx.fillText("得分：" + state.score, 14, 28);
  }
  function loop() {
    if (state.charging) state.charge = Math.min(1, state.charge + 0.02);
    draw();
    requestAnimationFrame(loop);
  }
  function jump() {
    var dist = 40 + state.charge * 160;
    var target = state.cur + 1;
    var tx = state.boxes[target];
    var landX = state.boxes[state.cur] + dist;
    state.charging = false; state.charge = 0;
    if (Math.abs(landX - tx) < 30) {
      state.cur = target; state.score++;
      state.boxes.push(state.boxes[state.boxes.length - 1] + 90 + Math.random() * 60);
      if (state.boxes[state.cur] > W - 80) {
        var shift = W - 80 - state.boxes[state.cur];
        state.boxes = state.boxes.map(function(x) { return x + shift; });
      }
      document.getElementById("jumpHint").textContent = "漂亮！当前得分 " + state.score;

// DOM .msg 索引（含时间条）转消息数组索引
function countDataMessagesBefore(chatId, domIdx) {
  var box = document.getElementById("chatMessages");
  var nodes = Array.prototype.slice.call(box.children);
  var dataCount = -1;
  for (var i = 0; i < nodes.length && i <= domIdx; i++) {
    if (nodes[i].classList && nodes[i].classList.contains("msg")) dataCount++;
  }
  return dataCount;
}

  var genders = ["female", "male"];
  var g = genders[Math.floor(Math.random() * 2)];
  var name = surnames[Math.floor(Math.random() * surnames.length)] +
    (g === "female" ? femaleFirst : maleFirst)[Math.floor(Math.random() * 10)] +
    (Math.random() < 0.4 ? "" : ((g === "female" ? femaleFirst : maleFirst)[Math.floor(Math.random() * 10)]));
  var job = jobs[Math.floor(Math.random() * jobs.length)];
  var age = 20 + Math.floor(Math.random() * 18);
  var region = SHAKE_REGIONS[Math.floor(Math.random() * SHAKE_REGIONS.length)];
  var sign = SHAKE_SIGNS[Math.floor(Math.random() * SHAKE_SIGNS.length)];
  var fallback = {
    name: name, gender: g, age: age, job: job, region: region, signature: sign,
    persona: (g === "female" ? "女生" : "男生") + "，" + age + "岁，" + job + "。" + SHAKE_PERSONAS[Math.floor(Math.random() * SHAKE_PERSONAS.length)],
    hello: "你好呀，很高兴认识你"
  };
  var sys = "你是微信用户资料生成器。生成一个真实可信的中国年轻人微信用户，输出 JSON（不要emoji，不要多余文字）：" +
    '{"name":"中文姓名","gender":"female或male","age":数字20-38,"job":"职业","region":"省份 城市","signature":"个性签名12字以内","persona":"完整人设：性别年龄职业性格爱好，60字以内，要具体","hello":"打招呼开场白一句话，15字以内"}';
  callTextJson(sys, "生成一个新的微信用户").then(function(j) {
    if (!j || !j.name) { buildAvatar(fallback, cb); return; }
    j.gender = (j.gender === "male" || j.gender === "男") ? "male" : "female";
    j.age = parseInt(j.age, 10) || age;
    buildAvatar(j, cb);
  });
  function buildAvatar(role, done) {
    var genderCn = role.gender === "male" ? "年轻男生" : "年轻女生";
    var prompt = "真实微信头像照片，" + genderCn + (role.age ? "，约" + role.age + "岁" : "") +
      "，" + (role.job || "") + "气质，自然光线，半身正面特写，生活感，写实摄影，方形构图";
    generateImageSrc(prompt, "512x512").then(function(src) {
      role.avatarSrc = src;
      done(role);
    });
  }
}

function sendFriendRequest(r) {
  r.id = "fr_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
  r.accepted = false;
  r.pending = true;
  friendRequests.unshift(r);
  store("wx_requests_v1", friendRequests);
  renderNewFriends();
  showToast("好友申请已发送");
  // AI 自动通过（1.5~4 秒）
  setTimeout(function() {
    acceptAiFriend(r);
  }, 1500 + Math.random() * 2500);
}

function acceptAiFriend(r) {
  var req = friendRequests.find(function(x) { return x.id === r.id; });
  if (!req || req.accepted) return;
  req.accepted = true;
  req.pending = false;
  store("wx_requests_v1", friendRequests);
  var role = req.role || {};
  // 已存在则直接打开
  var existed = personas.find(function(p) { return p.name === req.name; });
  var persona;
  if (existed) {
    persona = existed;
  } else {
    persona = {
      id: "p_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      name: req.name, avatar: req.avatar || fallbackImageSrc(req.name),
      wechat: "wx_" + Math.floor(Math.random() * 900000 + 100000),
      gender: role.gender || "female",
      persona: role.persona || ("一个通过" + (req.source || "微信") + "认识的朋友，" + (role.signature || "")),
      appearance: role.gender === "male" ? "一个年轻男生，干净清爽" : "一个年轻女生，清新自然",
      region: role.region || "浙江 杭州",
      lastMsg: role.hello || ("谢谢通过，我是" + req.name),
      lastTime: "刚刚",
      age: role.age, job: role.job, signature: role.signature,
      isStranger: true, source: req.source
    };
    personas.push(persona);
    store("wx_personas_v1", personas);
    aiStrangers.push(persona);
    saveAiStrangers();
    contacts.push({
      id: persona.id, name: persona.name, avatar: persona.avatar, wechat: persona.wechat,
      letter: letterOf(persona.name), isPersona: true, persona: persona.persona,
      appearance: persona.appearance, region: persona.region, gender: persona.gender
    });
    var cid = "c_" + persona.id;
    chats.unshift({
      id: cid, name: persona.name, avatar: persona.avatar,
      lastMsg: persona.lastMsg, time: "刚刚", unread: 1, muted: false,
      contactId: persona.id, isPersona: true, persona: persona.persona, appearance: persona.appearance
    });
    messages[cid] = [{ from: "other", text: persona.lastMsg, time: "刚刚" }];
    schedulePersonaFirst(persona.id);
  }
  renderContacts(); renderChats(); updateTabBadge();
  renderNewFriends();
  saveChatsState();
  showToast(persona.name + " 通过了你的好友申请");
  // 自动打开会话
  setTimeout(function() {
    switchTab("chats");
    openChat("c_" + persona.id);
  }, 800);
}

// ── 会话打开：取消隐藏 ──
var __origOpenChat = openChat;
openChat = function(id) {
  var chat = chats.find(function(c) { return String(c.id) === String(id); });
  if (chat) { chat.hidden = false; delete hiddenChats[String(chat.id)]; }

// ── 发消息：引用支持 ──
var __origSendMessage = sendMessage;
sendMessage = function() {
  var input = document.getElementById("chatInput");
  var text = input.value.trim();
  if (!text || !currentChatId) return;
  var msg = { from: "me", text: text };
  if (quoteMsg) {
    msg.quote = { from: quoteMsg.from, text: msgSummary(quoteMsg) };
  }
  var chat = chats.find(function(c) { return c.id === currentChatId; });
  pushMyMessage(msg, text);
  input.style.height = "auto";
  input.value = "";
  clearQuote();
  scheduleReply(chat, text);
};

// ── pushMyMessage：持久化 ──
var __origPushMyMessage = pushMyMessage;
pushMyMessage = function(msgObj, preview) {
  __origPushMyMessage(msgObj, preview);
  saveChatsState();
};

// ── 回复：文本 API 优先，失败降级本地语气池 ──
scheduleReply = function(chat, userText) {
  if (!chat || chat.isService) return;
  var cid = chat.id;
  var typingShown = false;
  // 先显示 typing
  setTimeout(function() {
    if (!messages[cid]) return;
    messages[cid].push({ from: "other", typing: true });
    typingShown = true;
    renderMessages(cid);
    var box = document.getElementById("chatMessages");
    if (box) box.scrollTop = box.scrollHeight;
  }, 700);
  // 延迟后调用 AI API
  setTimeout(function() {
    // 移除 typing
    if (!messages[cid]) return;
    for (var i = messages[cid].length - 1; i >= 0; i--) {
      if (messages[cid][i].typing) { messages[cid].splice(i, 1); break; }
    }
    typingShown = false;
    var sys = personaSystemPrompt(chat, "对话要连贯，记住之前聊过的内容。");
    callTextApi(sys, userText).then(function(reply) {
      if (!messages[cid]) return;
      // 如果 API 失败，降级到本地模板
      if (!reply) reply = generateReply(userText, chat);
      if (!reply || !String(reply).trim()) reply = "嗯";
      reply = String(reply).slice(0, 200);

// 按住说话结束：发真正的语音气泡 + AI 回复语音
var __origSetupHoldToTalk = setupHoldToTalk;
setupHoldToTalk = function(btn) {
  var overlay = document.getElementById("voiceOverlay");
  var voiceIcon = document.getElementById("voiceIcon");
  var voiceText = document.getElementById("voiceText");
  var cancelled = false, startY = 0, t0 = 0;
  function start(e) {
    e.preventDefault();
    cancelled = false; t0 = Date.now();
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    overlay.classList.add("active");
    voiceIcon.classList.add("recording");
    voiceText.textContent = "手指上滑，取消发送";
    voiceText.style.color = "";
  }
  function move(e) {
    if (!overlay.classList.contains("active")) return;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    if (startY - y > 80) {
      cancelled = true;
      voiceIcon.classList.remove("recording");
      voiceText.textContent = "松开手指，取消发送";
      voiceText.style.color = "#fa5151";
    } else {
      cancelled = false;
      voiceIcon.classList.add("recording");
      voiceText.textContent = "手指上滑，取消发送";
      voiceText.style.color = "";
    }
  }
  function end() {
    overlay.classList.remove("active");
    voiceIcon.classList.remove("recording");
    if (cancelled) return;
    var dur = Math.max(1, Math.min(60, Math.round((Date.now() - t0) / 1000)));
    pushMyMessage({ from: "me", type: "voice", duration: dur }, "[语音] " + dur + "\"");
    var chat = chats.find(function(c) { return c.id === currentChatId; });
    setTimeout(function() {
      incomingMessage(chat, { from: "other", type: "voice", duration: Math.max(1, dur - 1 + Math.floor(Math.random() * 3)), voiceText: null });
    }, 1300);
  }
  btn.addEventListener("touchstart", start, { passive: false });
  btn.addEventListener("touchmove", move, { passive: true });
  btn.addEventListener("touchend", end);
  btn.addEventListener("mousedown", start);
  btn.addEventListener("mousemove", move);
  btn.addEventListener("mouseup", end);
  btn.addEventListener("mouseleave", function() { if (overlay.classList.contains("active")) end(); });
};

// renderMessages 包装：引用块 + 序号索引（红包/转账/语音/公众号点击）
var __origRenderMessages = renderMessages;
renderMessages = function(chatId) {
  __origRenderMessages(chatId);
  var box = document.getElementById("chatMessages");
  var msgs = messages[chatId] || [];
  var msgEls = box.querySelectorAll(".msg");
  var dataIdx = -1;
  for (var i = 0; i < box.children.length; i++) {
    var node = box.children[i];
    if (!node.classList || !node.classList.contains("msg")) continue;
    dataIdx++;
    var m = msgs[dataIdx];
    if (!m) continue;
    node.dataset.midx = dataIdx;
    var bubble = node.querySelector(".msg-bubble");
    if (!bubble) continue;
    if (m.quote) {
      var q = document.createElement("div");
      q.className = "quote-block";
      q.textContent = (m.quote.from === "me" ? "我：" : "") + (m.quote.text || "消息");
      bubble.insertBefore(q, bubble.firstChild);
    }
  }
  // 红包/转账/公众号卡片点击（patch1 的索引换算兼容，用 data-midx 更准）
  msgEls = box.querySelectorAll(".msg");
  msgEls.forEach(function(el) {
    el.addEventListener("click", function(e) {
      var idx = parseInt(this.dataset.midx, 10);
      if (isNaN(idx)) return;
      var m = msgs[idx];
      if (!m) return;
      if (e.target.closest(".redpacket-bubble") && m.type === "redpacket") {
        openRedPacket(chatId, idx);
      } else if (e.target.closest(".transfer-bubble") && m.type === "transfer") {
        openTransfer(chatId, idx);
      } else if (e.target.closest(".oaarticle, .msg-bubble") && m.type === "oaarticle") {
        if (e.target.closest(".voice-bubble")) return;
        openArticle(m.oaId, m.articleId);
      }
    });
  });
};

            ? '<div class="pf-video-thumb" id="myVidThumb" style="width:100px;height:100px"><video src="'+myVid+'" muted playsinline style="width:100%;height:100%;object-fit:cover"></video><div class="play-badge">'+playSvg+'</div></div>'
            : '<div class="pf-video-placeholder" id="myVidPh" style="width:100px;height:100px">' + vidSvg + '<span>上传视频</span></div>') +
          '<input type="file" id="myVidFile" accept="video/mp4,video/webm,video/*" class="file-hidden">' +
        '</label>' +
        '<div style="flex:1">' +
          (myVid ? '<div style="font-size:13px;color:var(--text);margin-bottom:8px">已上传视频</div>' : '<div style="font-size:13px;color:var(--muted)">未上传，通话时显示头像</div>') +
          (myVid ? '<button id="myVidRemove" style="padding:6px 16px;border:1px solid #fa5151;border-radius:16px;background:none;color:#fa5151;font-size:13px;font-family:inherit;cursor:pointer">删除视频</button>' : '') +
        '</div>' +
      '</div>' +
      '<div style="margin-top:24px;padding:16px;background:var(--surface);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.6">' +
        '<b>提示：</b><br>' +
        '- 角色编辑里也可以为每个好友上传「视频通话画面」<br>' +
        '- 视频通话时全屏播放对方上传的视频<br>' +
        '- 未上传视频时显示头像 + 呼吸动效<br>' +
        '- 语音通话时不显示视频层' +
      '</div>' +
    '</div>';

  // 上传
  var fileInput = document.getElementById("myVidFile");
  if (fileInput) {
    fileInput.addEventListener("change", function() {
      var file = this.files && this.files[0];
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) {
        showToast("视频文件建议 20MB 以内，请先压缩");
        this.value = "";
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        try { localStorage.setItem("wx_my_call_video", e.target.result); } catch(ex) {
          showToast("视频太大，存储空间不足，请压缩后重试");
          return;
        }
        showToast("视频已保存");
        openMyCallVideoSettings(); // 刷新
      };
      reader.readAsDataURL(file);
      this.value = "";
    });
  }
  // 删除
  var removeBtn = document.getElementById("myVidRemove");
  if (removeBtn) {
    removeBtn.addEventListener("click", function() {
      try { localStorage.removeItem("wx_my_call_video"); } catch(e){}
      showToast("已删除");
      openMyCallVideoSettings();
    });
  }
}


// ── 调试 / 测试钩子 ──
  window.__wx = {
    get posts() { return posts; },
    get personas() { return personas; },
    get apiConfig() { return apiConfig; },
    personaPost: personaPost,
    openApiSettings: openApiSettings,
    openPersonaForm: openPersonaForm,
    openContactDetail: openContactDetail,
    savePersona: savePersona,
    updatePersona: updatePersona,
    readImageFileScaled: readImageFileScaled,
    playPersonaIntro: playPersonaIntro,
    momentSchedulerTick: momentSchedulerTick,
    generateMomentImage: generateMomentImage,
    deleteMomentPrompt: deleteMomentPrompt
  };
})();
</script>
</body>
</html>
